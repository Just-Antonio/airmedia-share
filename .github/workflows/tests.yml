name: tests

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a broken upstream wheel shows up before someone needs to present.
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
